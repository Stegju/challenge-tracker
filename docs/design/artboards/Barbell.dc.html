<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Barbell</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="{{label}}" style="width: {{outerW}}; height: {{outerH}}; overflow: hidden; color: #e6edf3; font-family: VT323, monospace">
<div style="width: 440px; height: 160px; position: relative; transform: scale({{scale}}); transform-origin: 0 0">
<div style="position: absolute; left: 4px; top: 72px; width: 6px; height: 16px; background: #8b97a8"></div>
<div style="position: absolute; left: 10px; top: 74px; width: 130px; height: 12px; background: #b8c2d0; box-shadow: inset 0 2px 0 #e3e8ef, inset 0 -2px 0 #7e8a9b"></div>
<div style="position: absolute; left: 140px; top: 69px; width: 10px; height: 22px; background: #c9d2de; box-shadow: inset 0 -3px 0 #7e8a9b"></div>
<div style="position: absolute; left: 150px; top: 77px; width: 140px; height: 6px; background: repeating-linear-gradient(90deg, #a3aebd 0 2px, #6b7686 2px 4px)"></div>
<div style="position: absolute; left: 290px; top: 69px; width: 10px; height: 22px; background: #c9d2de; box-shadow: inset 0 -3px 0 #7e8a9b"></div>
<div style="position: absolute; left: 300px; top: 74px; width: 130px; height: 12px; background: #b8c2d0; box-shadow: inset 0 2px 0 #e3e8ef, inset 0 -2px 0 #7e8a9b"></div>
<div style="position: absolute; left: 430px; top: 72px; width: 6px; height: 16px; background: #8b97a8"></div>
<div style="position: absolute; left: 10px; top: 20px; width: 128px; height: 120px; display: flex; flex-direction: row-reverse; gap: 2px">
<sc-for list="{{plates}}" as="p" hint-placeholder-count="2">
<div style="position: relative; height: 120px; width: {{p.w}}; background: {{p.c}}; box-shadow: inset 2px 0 0 rgba(255,255,255,0.35), inset -2px 0 0 rgba(0,0,0,0.35)"><div style="position: absolute; left: 0; right: 0; top: 52px; height: 16px; background: rgba(0,0,0,0.22)"></div></div>
</sc-for>
<sc-if value="{{hasGhost}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; height: 120px; width: {{ghost.w}}"><div style="position: absolute; inset: 0; box-sizing: border-box; border: 2px dashed {{ghost.c}}; opacity: 0.3"></div><div style="position: absolute; left: 0; right: 0; top: {{ghost.top}}; height: {{ghost.h}}; background: {{ghost.c}}; box-shadow: inset 2px 0 0 rgba(255,255,255,0.35), inset -2px 0 0 rgba(0,0,0,0.35)"></div></div>
</sc-if>
</div>
<div style="position: absolute; left: 302px; top: 20px; width: 128px; height: 120px; display: flex; flex-direction: row; gap: 2px">
<sc-for list="{{plates}}" as="p" hint-placeholder-count="2">
<div style="position: relative; height: 120px; width: {{p.w}}; background: {{p.c}}; box-shadow: inset 2px 0 0 rgba(255,255,255,0.35), inset -2px 0 0 rgba(0,0,0,0.35)"><div style="position: absolute; left: 0; right: 0; top: 52px; height: 16px; background: rgba(0,0,0,0.22)"></div></div>
</sc-for>
<sc-if value="{{hasGhost}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; height: 120px; width: {{ghost.w}}"><div style="position: absolute; inset: 0; box-sizing: border-box; border: 2px dashed {{ghost.c}}; opacity: 0.3"></div><div style="position: absolute; left: 0; right: 0; top: {{ghost.top}}; height: {{ghost.h}}; background: {{ghost.c}}; box-shadow: inset 2px 0 0 rgba(255,255,255,0.35), inset -2px 0 0 rgba(0,0,0,0.35)"></div></div>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"points":{"editor":"int","min":0,"max":1200,"default":201},"width":{"editor":"int","min":120,"max":880,"default":440},"$preview":{"width":440,"height":160}}'>
class Component extends DCLogic {
renderVals() {
const pts = Math.max(0, Number(this.props.points ?? 201));
const W = Number(this.props.width ?? 440);
const s = W / 440;
const cols = ['#f2f2f2', '#3ecf6a', '#f5d33b', '#3d8bff', '#ff4d4d'];
const th = [7, 9, 11, 13, 15];
const n = Math.min(10, Math.floor(pts / 100));
const tiers = [];
for (let i = 0; i < n; i++) tiers.push(Math.floor(i / 2));
tiers.sort((a, b) => b - a);
const plates = tiers.map((t) => ({ w: th[t] + 'px', c: cols[t] }));
const gt = Math.floor(n / 2);
const hasGhost = n < 10;
const frac = (pts % 100) / 100;
const ph = frac > 0 ? Math.max(4, Math.round(120 * frac)) : 0;
const ghost = hasGhost ? { w: th[gt] + 'px', c: cols[gt], h: ph + 'px', top: Math.round((120 - ph) / 2) + 'px' } : { w: '0px', c: '#000', h: '0px', top: '0px' };
return {
plates, hasGhost, ghost, scale: s,
outerW: Math.round(440 * s) + 'px', outerH: Math.round(160 * s) + 'px',
label: (pts / 100).toFixed(2) + ' plates per side: ' + n + ' full and a partial plate for the last ' + (pts % 100) + ' points'
};
}
}
</script>
</body>
</html>
