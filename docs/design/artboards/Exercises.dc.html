body{margin:0;background:#07090d}
a{color:#c6ff3d}a:hover{color:#e2ff9a}
.nt{clip-path:polygon(0 6px,2px 6px,2px 2px,6px 2px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 2px) calc(100% - 6px),calc(100% - 2px) calc(100% - 2px),calc(100% - 6px) calc(100% - 2px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 6px),0 calc(100% - 6px))}
.pn{background:rgba(18,24,34,0.92);box-shadow:inset 0 0 0 2px #232c3b}
.lbl{font-family:Silkscreen,monospace;font-size:10px;letter-spacing:1px;color:#8794a6}
.btn{height:48px;border:0;display:flex;align-items:center;justify-content:center;gap:8px;background:#c6ff3d;color:#0b0e13;text-decoration:none;font-family:Silkscreen,monospace;font-weight:700;font-size:12px;letter-spacing:1px}
.btn2{height:48px;border:0;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;box-shadow:inset 0 0 0 2px #3a4659;color:#c9d2de;text-decoration:none;font-family:Silkscreen,monospace;font-size:12px;letter-spacing:1px}
.inp{height:48px;width:100%;box-sizing:border-box;padding:0 12px;border:0;background:#0a0d12;box-shadow:inset 0 0 0 2px #2c3749;color:#ffffff;font-family:VT323,monospace;font-size:24px}
.flick{animation:flick 7s infinite steps(1)}
@keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.3}92%{opacity:1}94%{opacity:.55}95%{opacity:1}}
.hop{animation:hop 1.2s infinite steps(4)}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob{animation:bob 2.8s infinite steps(3)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.sway{animation:sway 4s infinite steps(2)}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
.dust{animation:dust 10s linear infinite}
@keyframes dust{0%{transform:translate(0,0);opacity:0}20%{opacity:.45}100%{transform:translate(16px,-140px);opacity:0}}
.pulse{animation:pulse 1.2s infinite steps(2)}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flick,.hop,.bob,.sway,.dust,.pulse{animation:none}}
</style>
</helmet>

<main style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 24px">

<header style="display: flex; align-items: center; gap: 12px">
<a href="Import.dc.html" aria-label="Back to import" class="nt pn" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #c6ff3d; text-decoration: none"><svg viewBox="0 0 12 12" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 5h8v2h-8zM4 3h2v2h-2zM2 4h2v4h-2zM4 7h2v2h-2zM6 2h1v1h-1zM6 9h1v1h-1z"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="lbl">PULL DAY · 11 MAR</span>
<h1 style="margin: 0; font-family: Silkscreen, monospace; font-weight: 700; font-size: 20px; color: #ffffff">6 EXERCISES</h1>
</div>
</header>

<p style="margin: 0; font-size: 18px; color: #8794a6">Warm-ups and drop sets are kept but never count as a best set.</p>

<sc-for list="{{ex}}" as="x" hint-placeholder-count="6">
<section class="nt" style="padding: 12px 14px; background: {{x.bg}}; box-shadow: inset 0 0 0 2px {{x.edge}}; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 22px; line-height: 1; color: #ffffff">{{x.name}}</span><span class="lbl" style="font-size: 9px; color: {{x.bestColor}}">{{x.best}}</span></span>
<button type="button" aria-pressed="{{x.pressed}}" onClick="{{x.toggle}}" class="nt" style="height: 32px; padding: 0 8px; border: 0; background: {{x.tBg}}; color: {{x.tFg}}; box-shadow: inset 0 0 0 2px {{x.tEdge}}; font-family: Silkscreen, monospace; font-size: 9px; letter-spacing: 1px">{{x.tLabel}}</button>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{x.sets}}" as="st" hint-placeholder-count="2">
<li style="display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; font-size: 19px; color: {{st.color}}"><span>{{st.n}}</span><span>{{st.v}}</span><span class="lbl" style="font-size: 9px">{{st.tag}}</span></li>
</sc-for>
</ol>
</section>
</sc-for>

</main>
<div style="position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 10">
<a href="Import.dc.html" class="nt btn" style="height: 54px">DONE · {{countLabel}}</a>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; z-index: 50; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0 1px, transparent 1px 3px)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const s = Object.assign({ counts: [true, false, false, false, false, false] }, this.state || {});
const W = (n, v) => ({ n, v, tag: 'WARM-UP', color: '#4d5869' });
const D = (n, v) => ({ n, v, tag: 'DROP SET', color: '#4d5869' });
const N = (n, v) => ({ n, v, tag: '', color: '#c9d2de' });
const data = [
['Pull Up', 'BEST 15 REPS · BODYWEIGHT', [W(1, '5 × BW'), N(2, '15 × BW'), N(3, '11 × BW')]],
['Lat Pulldown', 'E1RM 94.3 KG', [N(1, '10 × 65 kg'), N(2, '9 × 72.5 kg')]],
['Seated Cable Row', 'E1RM 84 KG · SHAKY, 12 REPS', [N(1, '12 × 60 kg'), D(2, '10 × 45 kg')]],
['Chin Up', 'BEST 8 REPS · BODYWEIGHT', [N(1, '8 × BW'), N(2, '7 × BW')]],
['Face Pull', 'E1RM 37.5 KG · SHAKY, 15 REPS', [N(1, '15 × 25 kg'), N(2, '15 × 25 kg')]],
['Hammer Curl', 'E1RM 22.8 KG', [N(1, '10 × 16 kg'), N(2, '8 × 18 kg')]]
];
const ex = data.map((d, i) => {
const on = s.counts[i];
return {
name: d[0], best: d[1], sets: d[2], pressed: on ? 'true' : 'false',
bg: on ? 'rgba(198,255,61,0.07)' : 'rgba(18,24,34,0.92)', edge: on ? '#c6ff3d' : '#232c3b',
bestColor: on ? '#c6ff3d' : '#8794a6',
tLabel: on ? 'COUNTS · MAR' : '+ COUNT', tBg: on ? '#c6ff3d' : 'transparent', tFg: on ? '#0b0e13' : '#8794a6', tEdge: on ? '#c6ff3d' : '#3a4659',
toggle: () => { const c = s.counts.slice(); c[i] = !c[i]; this.setState({ counts: c }); }
};
});
const n = s.counts.filter(Boolean).length;
return { ex, countLabel: n + ' COUNTED' };
}
}
</script>
